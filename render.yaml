services:
  - type: web
    name: socialboost
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m playwright install chromium
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: HEADLESS
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.9"
